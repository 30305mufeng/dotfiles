# font_family      CaskaydiaCove Nerd Font Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# enable_audio_bell no
# font_size 9.0
# window_padding_width 10
# include theme.conf
# cursor_trail 1
# #background_opacity 0.60
# #hide_window_decorations yes
# #confirm_os_window_close 0
#
# # initially empty, to be configured by user and remains static
# include userprefs.conf
#
# # Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults
#

font_family      CaskaydiaCove Nerd Font Mono
# font_family      JetBrainsMonoNerdFontMono-Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
# 不记住上次窗口大小/最大化状态, 否则 kitty 会带着 maximized 状态打开, 在 Hyprland 下先全屏再被平铺回去
remember_window_size no
initial_window_width  1260
initial_window_height 672
window_padding_width 15
include theme.conf
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0


# █░█ █▀ █▀▀ █▀█   █▀█ █▀█ █▀▀ █▀▀ █▀
# █▄█ ▄█ ██▄ █▀▄   █▀▀ █▀▄ ██▄ █▀░ ▄█

# 本文件在所有主题文件之后 source, 是个人偏好的最终覆盖点
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2
dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = false
}

decoration {
    # 覆盖主题的 rounding=10
    rounding = 2

    # blur 全局关闭: MX150 + UHD620 上关模糊换性能
    # 若要重新启用, 改为 true 并按需调整:
    #   size = 6 / passes = 3 / new_optimizations = true
    blur {
        enabled = false
    }

    # Shadow
    shadow {
        enabled = true
        range = 20
        offset = 0 2
        render_power = 4
        color = rgba(0000002A)
    }

    # Window Opacities
    # active_opacity = 1
    # inactive_opacity = 1
    # fullscreen_opacity = 1

    # Dim
    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0
}

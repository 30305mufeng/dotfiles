
# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/

windowrule = match:workspace special, no_shadow on

# ---------------- opacity 0.98 ----------------
windowrule = match:class firefox, opacity 0.98 0.98
windowrule = match:class Brave-browser, opacity 0.98 0.98
windowrule = match:class code-oss, opacity 0.98 0.98
windowrule = match:class code, opacity 0.98 0.98
windowrule = match:class code-url-handler, opacity 0.98 0.98

# ---------------- opacity 0.90 ----------------
windowrule = match:class code-insiders-url-handler, opacity 0.90 0.90
windowrule = match:class kitty, opacity 0.90 0.90
windowrule = match:class org.kde.dolphin, opacity 0.90 0.90
windowrule = match:class org.kde.ark, opacity 0.90 0.90
windowrule = match:class nwg-look, opacity 0.90 0.90
windowrule = match:class qt5ct, opacity 0.90 0.90
windowrule = match:class qt6ct, opacity 0.90 0.90
windowrule = match:class kvantummanager, opacity 0.90 0.90

# ---------------- opacity 0.90 / 0.80 ----------------
windowrule = match:class org.pulseaudio.pavucontrol, opacity 0.90 0.80
windowrule = match:class blueman-manager, opacity 0.90 0.80
windowrule = match:class nm-applet, opacity 0.90 0.80
windowrule = match:class nm-connection-editor, opacity 0.90 0.80
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, opacity 0.90 0.80
windowrule = match:class polkit-gnome-authentication-agent-1, opacity 0.90 0.80
windowrule = match:class org.freedesktop.impl.portal.desktop.gtk, opacity 0.90 0.80
windowrule = match:class org.freedesktop.impl.portal.desktop.hyprland, opacity 0.90 0.80

windowrule = match:class Steam, opacity 0.90 0.90
windowrule = match:class steamwebhelper, opacity 0.90 0.90
windowrule = match:class Spotify, opacity 0.90 0.90

# ---------------- opacity 0.80 ----------------
windowrule = match:class com.github.rafostar.Clapper, opacity 0.80 0.80
windowrule = match:class com.github.tchx84.Flatseal, opacity 0.80 0.80
windowrule = match:class hu.kramo.Cartridges, opacity 0.80 0.80
windowrule = match:class com.obsproject.Studio, opacity 0.80 0.80
windowrule = match:class gnome-boxes, opacity 0.80 0.80
windowrule = match:class vesktop, opacity 0.80 0.80
windowrule = match:class discord, opacity 0.80 0.80
windowrule = match:class WebCord, opacity 0.80 0.80
windowrule = match:class ArmCord, opacity 0.80 0.80
windowrule = match:class app.drey.Warp, opacity 0.80 0.80
windowrule = match:class net.davidotek.pupgui2, opacity 0.80 0.80
windowrule = match:class yad, opacity 0.80 0.80
windowrule = match:class Signal, opacity 0.80 0.80
windowrule = match:class io.github.alainm23.planify, opacity 0.80 0.80
windowrule = match:class io.gitlab.theevilskeleton.Upscaler, opacity 0.80 0.80
windowrule = match:class com.github.unrud.VideoDownloader, opacity 0.80 0.80
windowrule = match:class io.gitlab.adhami3310.Impression, opacity 0.80 0.80
windowrule = match:class io.missioncenter.MissionCenter, opacity 0.80 0.80
windowrule = match:class io.github.flattool.Warehouse, opacity 0.80 0.80

# ---------------- float rules ----------------
windowrule = match:class org.kde.dolphin, match:title "Progress Dialog — Dolphin", float 1
windowrule = match:class org.kde.dolphin, match:title "Copying — Dolphin", float 1
windowrule = match:title "About Mozilla Firefox", float 1
windowrule = match:class firefox, match:title "Picture-in-Picture", float 1
windowrule = match:class firefox, match:title Library, float 1
windowrule = match:class kitty, match:title top, float 1
windowrule = match:class kitty, match:title btop, float 1
windowrule = match:class kitty, match:title htop, float 1

windowrule = match:class vlc, float 1
windowrule = match:class kvantummanager, float 1
windowrule = match:class qt5ct, float 1
windowrule = match:class qt6ct, float 1
windowrule = match:class nwg-look, float 1
windowrule = match:class org.kde.ark, float 1
windowrule = match:class org.pulseaudio.pavucontrol, float 1
windowrule = match:class blueman-manager, float 1
windowrule = match:class nm-applet, float 1
windowrule = match:class nm-connection-editor, float 1
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, float 1

windowrule = match:class Signal, float 1
windowrule = match:class com.github.rafostar.Clapper, float 1
windowrule = match:class app.drey.Warp, float 1
windowrule = match:class net.davidotek.pupgui2, float 1
windowrule = match:class yad, float 1
windowrule = match:class eog, float 1
windowrule = match:class io.github.alainm23.planify, float 1
windowrule = match:class io.gitlab.theevilskeleton.Upscaler, float 1
windowrule = match:class com.github.unrud.VideoDownloader, float 1
windowrule = match:class io.gitlab.adhami3310.Impression, float 1
windowrule = match:class io.missioncenter.MissionCenter, float 1


# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur on, match:namespace rofi, no_screen_share on
layerrule = blur on, match:namespace notifications
layerrule = blur on, match:namespace swaync-notification-window
# layerrule = ignorezero,swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
# layerrule = ignorezero,swaync-control-center
layerrule = blur on, match:namespace logout_dialog
